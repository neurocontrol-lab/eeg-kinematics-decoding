<script>
"use strict";
const data = JSON.parse(document.querySelector("#report-data").content.textContent);
const isPreview = location.hostname === "htmlpreview.github.io";
const base = "https://github.com/neurocontrol-lab/eeg-kinematics-decoding/blob/main/outputs/reports/";
const nav = document.querySelector("#nav");
const main = document.querySelector("#content");
const palette = ["#147884","#61629b","#a44825","#30658f","#667347","#9a4b72","#63584c","#486478"];
const collator = new Intl.Collator("en", {numeric:true,sensitivity:"base"});
function element(tag, text, parent, props={}) {
  const node = document.createElement(tag);
  if (text !== null) node.textContent = text;
  for (const [name,value] of Object.entries(props)) node.setAttribute(name,value);
  parent.append(node);
  return node;
}
function link(label, href, parent) { return element("a", label, parent, {href}); }
function reportLink(slug) {
  const file = slug ? slug + "/index.html" : "index.html";
  if (isPreview) return "https://htmlpreview.github.io/?" + base + file;
  return data.category ? "../" + file : file;
}
function format(value, precise=false) {
  if (value === null) return "—";
  if (typeof value !== "number") return value;
  if (precise) return String(value);
  return value !== 0 && Math.abs(value)<0.001 ? value.toExponential(2) :
    value.toLocaleString("en",{maximumFractionDigits:4});
}
function ordered(values) {
  return [...new Set(values)].sort((a,b)=>typeof a==="number"&&typeof b==="number" ? a-b : collator.compare(a,b));
}
function selector(parent, name, options, all=true) {
  const container=element("label",name,parent);
  const select=element("select",null,container,{"aria-label":name});
  if (all) element("option","All",select,{value:""});
  for (const [i,value] of options.entries()) element("option",value,select,{value:i});
  return select;
}
function svgNode(tag, props, parent, title=null) {
  const node=document.createElementNS("http://www.w3.org/2000/svg",tag);
  for(const [key,value] of Object.entries(props)) node.setAttribute(key,value);
  if(title!==null) node.textContent=title;
  parent.append(node);
  return node;
}
function chart(parent, view, rows) {
  parent.replaceChildren();
  if (!view.chart || !rows.length) return;
  const {category,value,series,low,high}=view.chart;
  const withValues=rows.filter(r=>Number.isFinite(r[value]));
  const showControls=series===null || withValues.every(r=>view.chart.contextOnly.includes(r[series]));
  const points=showControls ? withValues : withValues.filter(r=>!view.chart.contextOnly.includes(r[series]));
  const uniqueKeys=new Set(points.map(r=>JSON.stringify([r[category],series===null?null:r[series]])));
  if (!points.length) return;
  if (uniqueKeys.size!==points.length) {
    element("p","Choose filters to show one value per chart group.",parent,{class:"chart-note"});
    return;
  }
  const values=points.flatMap(r=>[r[value], ...(low===null?[]:[r[low],r[high]].filter(Number.isFinite))]);
  if (view.reference!==null) values.push(view.reference);
  const rawMin=Math.min(...values), rawMax=Math.max(...values);
  const pad=(rawMax-rawMin || Math.abs(rawMax) || 1)*.1;
  const lo=rawMin-pad, hi=rawMax+pad;
  const categories=view.order ? view.order.filter(x=>points.some(r=>r[category]===x)) : ordered(points.map(r=>r[category]));
  const allSeries=series===null ? [null] : ordered(view.rows.map(r=>r[series]));
  const groups=allSeries.filter(g=>points.some(r=>series===null || r[series]===g));
  const width=Math.max(720,categories.length*Math.max(44,Math.min(118,Math.max(...categories.map(c=>String(c).length))*6))+120), left=69, right=width-20, top=22, bottom=193;
  const step=(right-left)/categories.length, x=(i)=>left+(i+.5)*step;
  const y=(v)=>bottom-(v-lo)/(hi-lo)*(bottom-top);
  element("h3",view.headers[value],parent);
  const svg=svgNode("svg",{viewBox:"0 0 "+width+" 248",role:"img","aria-label":view.headers[value]+" by "+view.headers[category]},parent);
  for (let i=0;i<=4;i++) {
    const val=lo+(hi-lo)*i/4;
    svgNode("line",{x1:left,x2:right,y1:y(val),y2:y(val),stroke:"#d9e3e9"},svg);
    svgNode("text",{x:left-7,y:y(val)+4,"text-anchor":"end",class:"axis-label"},svg,format(Number(val.toPrecision(3))));
  }
  if(view.reference!==null) svgNode("line",{x1:left,x2:right,y1:y(view.reference),y2:y(view.reference),stroke:"#6b7f90","stroke-dasharray":"5 4"},svg);
  categories.forEach((c,i)=>svgNode("text",{x:x(i),y:bottom+22,"text-anchor":"middle",class:"axis-label"},svg,c));
  svgNode("text",{x:(left+right)/2,y:241,"text-anchor":"middle",class:"axis-label"},svg,view.headers[category]);
  groups.forEach((g,j)=>{
    const color=palette[allSeries.indexOf(g)%palette.length];
    const offset=groups.length===1?0:(j-(groups.length-1)/2)*Math.min(12,step*.62/groups.length);
    const seriesRows=categories.map(c=>points.find(r=>r[category]===c&&(series===null||r[series]===g)));
    const lineSegments=[];let segment=[];
    for(const [i,r] of seriesRows.entries()){
      if(!r){if(segment.length)lineSegments.push(segment);segment=[];continue;}
      segment.push([x(i)+offset,y(r[value])]);
    }
    if(segment.length)lineSegments.push(segment);
    if(groups.length>1 && categories.length>1) for(const segment of lineSegments) if(segment.length>1) {
      svgNode("polyline",{points:segment.map(p=>p.join(",")).join(" "),fill:"none",stroke:color,"stroke-width":1.45,opacity:.64},svg);
    }
    for(const [i,r] of seriesRows.entries()){
      if(!r)continue;
      const at=x(i)+offset;
      const interval=low!==null && Number.isFinite(r[low]) && Number.isFinite(r[high]);
      if(interval)svgNode("line",{x1:at,x2:at,y1:y(r[low]),y2:y(r[high]),stroke:color,"stroke-width":1.4},svg);
      const dot=svgNode("circle",{cx:at,cy:y(r[value]),r:4,fill:color},svg);
      svgNode("title",{},dot,[r[category],g,format(r[value]),!interval?null:"95% interval ["+format(r[low])+", "+format(r[high])+"]"].filter(v=>v!==null).join(" · "));
    }
  });
  if(series!==null) {
    const legend=element("div",null,parent,{class:"legend"});
    for(const g of groups){
      const item=element("span",null,legend);
      element("i",null,item,{class:"swatch",style:"background:"+palette[allSeries.indexOf(g)%palette.length]});
      item.append(document.createTextNode(g));
    }
  }
  if(view.reference!==null)element("p","Dashed line at "+format(Number(view.reference.toFixed(2))),parent,{class:"chart-note"});
  if(points.length!==withValues.length) element("p","Previous-weight and schedule controls are in the table. Select either model to plot it.",parent,{class:"chart-note"});
}
function explore(parent, views) {
  const bar=element("div",null,parent,{class:"controls"});
  const select=selector(bar,"Result view",views.map(v=>v.title),false);
  const panel=element("section",null,parent);
  const selections=new Map();
  function show(){
    panel.replaceChildren();
    const view=views[Number(select.value)];
    if(view.description) element("p",view.description,panel);
    const filters=element("div",null,panel,{class:"controls"});
    const filterList=view.filters.map(column=>{
      const name=view.headers[column];
      const values=ordered(view.rows.map(r=>r[column]));
      const required=view.selectors.includes(column);
      const initial=values.indexOf(view.initial[name]);
      const defaultValue=initial>=0?String(initial):required?"0":"";
      const input=selector(filters,name,values,!required);
      const remembered=selections.get(name);
      if(remembered==="") input.value=required?defaultValue:"";
      else{
        const i=values.indexOf(remembered);
        input.value=i>=0?String(i):defaultValue;
      }
      return {column,name,values,input,defaultValue};
    });
    const reset=element("button","Reset filters",filters,{type:"button"});
    const fig=element("div",null,panel,{class:"chart"});
    const count=element("div",null,panel,{class:"count","aria-live":"polite"});
    const box=element("div",null,panel,{class:"table",tabindex:"0","aria-label":view.title});
    const table=element("table",null,box);
    const header=element("tr",null,element("thead",null,table));
    const body=element("tbody",null,table);
    let sort=-1, direction=1;
    const columns=view.headers.map((name,i)=>{
      const th=element("th",null,header,{scope:"col"});
      const button=element("button",name,th,{type:"button",title:"Sort by "+name});
      button.addEventListener("click",()=>{direction=sort===i?-direction:1;sort=i;draw();});
      return th;
    });
    function draw(){
      const rows=view.rows.filter(r=>filterList.every(f=>f.input.value===""||r[f.column]===f.values[Number(f.input.value)]));
      if(sort!==-1) rows.sort((a,b)=>{
        const x=a[sort],y=b[sort];
        if(x===null||y===null) return x===y?0:x===null?1:-1;
        return direction*(typeof x==="number"&&typeof y==="number" ? x-y : collator.compare(x,y));
      });
      columns.forEach((th,i)=>{if(i===sort) th.setAttribute("aria-sort",direction===1?"ascending":"descending");else th.removeAttribute("aria-sort");});
      count.textContent=rows.length.toLocaleString()+" of "+view.rows.length.toLocaleString()+" rows";
      body.replaceChildren();
      if(!rows.length) element("td","No matching rows.",element("tr",null,body),{colspan:view.headers.length});
      for(const row of rows){
        const tr=element("tr",null,body);
        for(const value of row)element("td",format(value),tr,typeof value==="number"?{title:format(value,true)}:{});
      }
      chart(fig,view,rows);
    }
    filterList.forEach(f=>f.input.addEventListener("change",()=>{
      selections.set(f.name,f.input.value===""?"":f.values[Number(f.input.value)]);
      draw();
    }));
    reset.addEventListener("click",()=>{
      selections.clear();
      filterList.forEach(f=>{f.input.value=f.defaultValue;});
      draw();
    });
    draw();
  }
  select.addEventListener("change",show);show();
}

  document.querySelector("#intro").textContent="Browse saved results for the ten experiment families. Filter participant, model and stage results, and open the detailed reports from each page.";
  const grid=element("div",null,main,{class:"grid"});
  for(const cat of data.categories){
    const card=element("a",null,grid,{class:"card",href:reportLink(cat.slug)});
    element("h2",cat.title,card);
    element("p",cat.summary,card);
  }
}else{
  document.querySelector("#heading").textContent=data.category.title;
  document.querySelector("#intro").textContent=data.category.summary;
  for(const study of data.studies){
    const area=element("article",null,main);
    element("h2",study.title,area);
    element("p",study.summary,area);
    if(study.terms.length){
      const definitions=element("section",null,area,{class:"definitions"});
      element("h3","How to read these results",definitions);
      const list=element("dl",null,definitions);
      for(const [term,definition] of study.terms){
        element("dt",term,list);
        element("dd",definition,list);
      }
    }
    explore(area,study.views);
    if(study.figures.length){
      const details=element("details",null,area);
      element("summary","Saved figures",details);
      for(const [caption,src] of study.figures){
        const figure=element("figure",null,details);
        element("img",null,figure,{alt:caption,src,loading:"lazy"});
        element("figcaption",caption,figure);
      }
    }
    if(study.limits)element("p",study.limits,area,{class:"chart-note"});
    const links=element("div",null,area,{class:"sources"});
    for(const [name,href] of study.sources) link(name,href,links);
  }
}
</script>
</body>
</html>
